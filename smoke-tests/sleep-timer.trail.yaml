config:
  devices:
    android:
      driver: ANDROID_ONDEVICE_ACCESSIBILITY
  title: sleep-timer

trail:
  - step: "Start Voice fresh on the library"
    recording:
      android:
        - android_forceStop:
            appId: de.ph1b.audiobook
        - openApp:
            appId: de.ph1b.audiobook

  - step: "Open the book Treeman"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              containsChild:
                androidAccessibility:
                  textRegex: Treeman

  - step: "Set the sleep timer to 15 minutes"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: sleep_timer
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: 15 minutes

  - step: "The button shows 15:00"
    recording:
      android:
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: sleep_timer
              containsChild:
                androidAccessibility:
                  textRegex: "15:00"

  - step: "Play, and the time on the button goes down"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: play
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: sleep_timer
              containsChild:
                androidAccessibility:
                  textRegex: "14:\\d{2}"

  - step: "Pause"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: pause
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: play

  - step: "Press the button, and the timer is off"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: sleep_timer
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: sleep_timer
                isChecked: false
