config:
  devices:
    android:
      driver: ANDROID_ONDEVICE_ACCESSIBILITY
  title: listen
  target: voice

trail:
  - step: "Start Voice fresh on the library"
    recording:
      android:
        - android_forceStop:
            appId: de.ph1b.audiobook
        - openApp:
            appId: de.ph1b.audiobook

  - step: "Open the book Snakey"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              containsChild:
                androidAccessibility:
                  textRegex: Snakey

  - step: "Remember the position before playback"
    recording:
      android:
        - rememberTextBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: elapsed
            variable: start

  - step: "Start playback"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: play

  - step: "The button shows Pause"
    recording:
      android:
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: pause

  - step: "The time moves on"
    recording:
      android:
        - assertNotVisibleWithText:
            text: "{{start}}"

  - step: "Pause playback"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: pause

  - step: "The button shows Play again"
    recording:
      android:
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: play

  - step: "Remember the position where playback paused"
    recording:
      android:
        - rememberTextBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: elapsed
            variable: paused

  - step: "Close the player"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: close

  - step: "The library is back"
    recording:
      android:
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: library_search

  - step: "Force-stop Voice and open it again"
    recording:
      android:
        - android_forceStop:
            appId: de.ph1b.audiobook
        - openApp:
            appId: de.ph1b.audiobook

  - step: "Open Snakey from Continue listening"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: continue_listening
              containsChild:
                androidAccessibility:
                  textRegex: Snakey

  - step: "The player is at the place where playback paused"
    recording:
      android:
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                resourceIdRegex: elapsed
                textRegex: "{{paused}}"
