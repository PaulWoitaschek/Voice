config:
  devices:
    android:
      driver: ANDROID_ONDEVICE_ACCESSIBILITY
  title: first-start

trail:
  - step: "Clear the app data and open Voice"
    recording:
      android:
        - mobile_clearAppData:
            appId: de.ph1b.audiobook
        # The picker opens in the folder it showed last.
        - mobile_clearAppData:
            appId: com.google.android.documentsui
        - openApp:
            appId: de.ph1b.audiobook

  - step: "Start the onboarding"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: "Let's go"

  - step: "Go to the folder step"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Next

  - step: "Open Android's folder picker"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Choose a folder

  # The picker's folders ignore Trailblaze's taps, so the keyboard opens them. Typing a name focuses that folder,
  # but only while the focus is in the folder list. Down keys stop at the button above the list, and Tab moves on
  # to the list. Trailblaze's pressKey sometimes loses the Enter here, so adb sends it, like the other keys.
  - step: "Open the testfiles folder"
    recording:
      android:
        - android_adbShell:
            command: [input, keyevent, KEYCODE_DPAD_DOWN]
        - android_adbShell:
            command: [input, keyevent, KEYCODE_DPAD_DOWN]
        - android_adbShell:
            command: [input, keyevent, KEYCODE_DPAD_DOWN]
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                isFocused: true
                textRegex: "(?i)create new folder"
        - android_adbShell:
            command: [input, keyevent, KEYCODE_TAB]
        - android_adbShell:
            command: [input, text, testfiles]
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                isFocused: true
              containsDescendants:
                - androidAccessibility:
                    textRegex: testfiles
        - android_adbShell:
            command: [input, keyevent, KEYCODE_ENTER]
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: SingleAudiobook

  - step: "Open the Audiobooks folder in testfiles"
    recording:
      android:
        - android_adbShell:
            command: [input, text, Audiobooks]
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                isFocused: true
              containsDescendants:
                - androidAccessibility:
                    textRegex: Audiobooks
        - android_adbShell:
            command: [input, keyevent, KEYCODE_ENTER]
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Dream in a Boat

  - step: "Use this folder and allow access"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: "(?i)use this folder"
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: "(?i)allow"

  - step: "Add the books"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Add 6 books

  - step: "Start listening"
    recording:
      android:
        - tapOnElementBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Start Listening

  - step: "The library shows the six books"
    recording:
      android:
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Search your library
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Dream in a Boat
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: El Guitarrero
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Snakey
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: The Boy and the Cave
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: The Fabulous Geysha
        - assertVisibleBySelector:
            nodeSelector:
              androidAccessibility:
                textRegex: Treeman
