name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call: { }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Lint
        run: ./gradlew :app:lintFossDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/**/*.html
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Tests + Formatting + Build
        run: ./gradlew voiceUnitTest spotlessCheck :app:assembleFossDebug
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Unit Tests"
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4, 5, broken]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.attempt == 'broken'
        run: sed -i 's/Search your library/No such text/' .agents/skills/emulator/trails/play-a-book.trail.yaml
      - uses: ./.github/actions/build_setup
      - name: Build
        run: ./gradlew :app:assembleFossDebug
      - name: Install agent-device
        run: npm install -g agent-device@0.21.39
      - uses: block/trailblaze/.github/actions/trailblaze@v2026.11.20
        with:
          trails: .agents/skills/emulator/trails
          setup: >-
            python3 scripts/populate_test_files.py --skip-adb
            && ANDROID_SERIAL=emulator-5554 .agents/skills/emulator/scripts/emulator.py setup
          comment: false
          artifact-suffix: -${{ matrix.attempt }}
