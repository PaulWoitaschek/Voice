name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_call: { }

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Lint
        run: ./gradlew :app:lintFreeDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: app/build/reports/**/*.html
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build_setup
      - name: Check locale config
        run: ./scripts/check_locale_config.main.kts
      - name: Tests + Formatting + Build
        run: ./gradlew voiceUnitTest lintKotlin :app:assembleFreeDebug
      - name: Publish JUnit Report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/test-results/**/TEST-*.xml'
          check_name: "Unit Tests"
