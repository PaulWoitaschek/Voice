name: Build and Deploy Pages

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'website/**'
      - PRIVACY.md
      - 'artwork/public/**'
      - artwork/src/templates/decor.ts
      - fastlane/metadata/android/en-US/images/featureGraphic.png
      - 'docs/prototypes/**'
      - .github/workflows/deploy_pages.yml
  pull_request:
    paths: *paths
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          path: website

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
